name: codetekt-frontend
services:
  app:
    container_name: codetekt-frontend
    image: ${FRONTEND_IMAGE:?An immutable image is required}
    env_file:
      - /etc/codetekt-frontend-deploy/runtime.env
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/robots.txt').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - proxy
networks:
  proxy:
    external: true
    name: supabase_default
